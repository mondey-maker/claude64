plugins {
    id 'com.android.application'
}

android {
    namespace 'com.claude64.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.claude64.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // replace with your own keystore to publish
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }    // libmain.so is also opened by path by the game
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
